[app]
name = "Global Commodity Intelligence Lab"
version = "0.1.0"
data_mode = "mock"  # mock | live

[paths]
raw = "data/raw"
processed = "data/processed"
historical = "data/historical"
mock = "data/mock"
reports = "reports"

[quant]
zscore_window = 20
rsi_period = 14
macd_fast = 12
macd_slow = 26
macd_signal = 9
vol_window = 21
momentum_lookbacks = [5, 21, 63]

[categories]
energy = ["WTI", "Brent", "Natural Gas", "Coal", "Uranium"]
metals = ["Gold", "Silver", "Copper", "Aluminium", "Iron Ore", "Nickel", "Lithium"]
agriculture = ["Soybeans", "Corn", "Wheat", "Coffee", "Sugar", "Cotton", "Cocoa", "Live Cattle"]
fertilizers = ["Urea", "DAP", "Potash"]
